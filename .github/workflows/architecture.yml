name: Architecture Topology (LikeC4 & GitHub Pages)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify architecture topology is in sync with domain model
        env:
          PYTHONPATH: src
        run: |
          python3 -c '
          from pathlib import Path
          from expensieve.domain.architecture import compile_architecture_bundle
          bundle = compile_architecture_bundle()
          assert Path("architecture/likec4.config.json").read_text(encoding="utf-8") == bundle.likec4_config_json, "likec4.config.json is out of sync"
          assert Path("architecture/topology.c4").read_text(encoding="utf-8") == bundle.likec4_dsl, "topology.c4 is out of sync"
          assert Path("ARCHITECTURE.md").read_text(encoding="utf-8") == bundle.architecture_markdown, "ARCHITECTURE.md is out of sync"
          print("✅ LikeC4 topology & ARCHITECTURE.md are in sync")
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate LikeC4 DSL model
        run: npx --yes likec4 validate architecture

      - name: Build LikeC4 static architecture site
        run: npx --yes likec4 build architecture --base /expensieve/ -o dist/architecture

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/architecture

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
