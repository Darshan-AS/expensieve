name: CI — Quality Gates, Tests & LikeC4 Architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python 3.14 — Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Sync project and development dependencies
        run: uv sync --all-groups --default-index https://pypi.org/simple

      - name: Run Ruff linter
        run: uv run --no-sync ruff check src tests

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Run Mypy strict type checker
        run: uv run --no-sync mypy src tests

      - name: Run Pytest unit & integration test suite
        run: uv run --no-sync pytest -v

      - name: Smoke-test ./sieve CLI, Namma Metro Gazetteer & Staged Sync
        run: |
          ./sieve --help
          ./sieve snap "12.9962°, 77.6685°"
          ./sieve sync --statement tests/fixtures/sample_statement.txt --output dist/staged_transactions.json

  likec4-architecture:
    name: LikeC4 — Validate & Build Architecture Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install LikeC4 CLI
        run: npm install --no-save likec4

      - name: Validate LikeC4 DSL model (docs/architecture/expensieve.c4)
        run: npx likec4 validate docs/architecture

      - name: Build static interactive LikeC4 architecture portal
        run: npx likec4 build docs/architecture -o dist/architecture

      - name: Upload compiled LikeC4 site artifact
        uses: actions/upload-artifact@v4
        with:
          name: expensieve-likec4-architecture
          path: dist/architecture
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/architecture

  deploy-architecture-pages:
    name: GitHub Pages — Publish Interactive LikeC4 Architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-and-tests, likec4-architecture]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy LikeC4 viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
