name: CI — Quality Gates & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python 3.14 — Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Sync project and development dependencies
        run: uv sync --all-groups --default-index https://pypi.org/simple

      - name: Run Ruff linter
        run: uv run --no-sync ruff check src tests

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Run Mypy strict type checker
        run: uv run --no-sync mypy src tests

      - name: Run Pytest unit & integration test suite
        run: uv run --no-sync pytest -v

      - name: Smoke-test ./sieve CLI, Gazetteer, Diagram Sync & Staged Sync
        run: |
          ./sieve --help
          ./sieve diagram --check
          ./sieve snap "12.9962°, 77.6685°"
          ./sieve sync --statement tests/fixtures/sample_statement.txt --output dist/staged_transactions.json
