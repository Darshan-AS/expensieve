[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expensieve"
version = "0.1.0"
description = "ExpenSieve: App-agnostic personal expense enrichment engine & multi-source reconciliation pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
sieve = "expensieve.cli.app:main"
expensieve = "expensieve.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expensieve"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["expensieve"]

[[tool.mypy.overrides]]
module = ["sourdough", "sourdough.*"]
ignore_missing_imports = true
